name: ML checks

on:
  push:
    branches: [main]
    paths: ['ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install (CPU-only PyTorch)
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Tests (features, generator, model, ONNX parity)
        run: pytest -q

      - name: Training smoke test (tiny synthetic set, does not touch the shipped model)
        run: python train_export.py --epochs 2 --synthetic-per-class 40 --transitions 40 --subjects 8 --out /tmp/smoke
